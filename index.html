<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04050A">
<title>Rota · TUS 23 Ağustos</title>
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --void:#04050A;
  --cam:rgba(255,255,255,.045); --cam2:rgba(255,255,255,.075); --kn:rgba(255,255,255,.085);
  --ink:#EDEFF2; --ink2:#A6ADB8; --ink3:#6E7684; --ink4:#4A515D;
  --doom:#6FA35A; --doomL:#93C47B;
  --altin:#D8B26A; --bilgi:#7BA7D9;
  --up:#6FA35A; --down:#B5544C;
  --pembe:#D98BA0; --turuncu:#D2955F; --sari:#C9B96C; --mavi:#7C9CBE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#04050A;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--ink);
  background:radial-gradient(155% 105% at 50% -14%,#0B1020 0%,#06080F 42%,#04050A 100%);
  font:400 15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
  letter-spacing:-.006em;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.cap{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);font-weight:500}
#gok{position:fixed;inset:0;z-index:0;pointer-events:none}
#toz{position:fixed;inset:0;z-index:60;pointer-events:none}

header{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:14px 24px 10px;position:relative;z-index:5;flex-wrap:nowrap}
header>nav{margin-top:2px}
.sol{display:flex;flex-direction:column;gap:7px}
.sayac{display:flex;align-items:baseline;gap:10px}
.sayac .n{font-size:31px;line-height:1;font-weight:200;letter-spacing:-.035em}
.sayac .l{font-size:11px;line-height:1.3;color:var(--ink3)}
.sayac .l b{display:block;color:var(--ink2);font-weight:500}
#kacir{display:none;align-self:flex-start;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;
  border:.5px solid rgba(216,178,106,.5);background:rgba(216,178,106,.12);color:var(--altin);
  font-size:11.5px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(10px);
  animation:nefes 3.4s ease-in-out infinite}
#kacir.gor{display:inline-flex}
@keyframes nefes{0%,100%{box-shadow:0 0 0 0 rgba(216,178,106,0)}50%{box-shadow:0 0 14px -2px rgba(216,178,106,.45)}}
.okumalar{display:flex;gap:24px}
.ok{text-align:right}
.ok .v{font-size:22px;line-height:1;font-weight:300;letter-spacing:-.025em;margin:4px 0 3px}
.ok.hyl .v{color:var(--doomL)}
.ok .s{font-size:10.5px;color:var(--ink3)}
.ok .s em{font-style:normal;color:var(--doomL)}
.spor{font-size:10.5px;color:var(--bilgi);letter-spacing:.01em}

main{flex:1 1 auto;position:relative;overflow:hidden;z-index:5}
.vw{position:absolute;inset:0;opacity:0;pointer-events:none}
.vw.on{opacity:1;pointer-events:auto}

/* ── ROTA ── */
#rota{display:grid;grid-template-columns:minmax(310px,38%) 1fr;height:100%}
#cark{position:relative;overflow:hidden;min-height:0}
#ray{position:absolute;inset:0;pointer-events:none;z-index:0}
.sahne{position:absolute;left:0;right:0;top:50%;z-index:1}
.sr.act{z-index:9}
.sr{position:absolute;left:14px;right:14px;top:0;transform-origin:50% 50%;
  transition:transform .52s cubic-bezier(.24,.74,.22,1),opacity .40s ease}
.serit{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:11px;
  background:rgba(255,255,255,.034);border:.5px solid rgba(255,255,255,.065);
  backdrop-filter:blur(13px);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 50%,rgba(0,0,0,.30) 86%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 50%,rgba(0,0,0,.30) 86%,rgba(0,0,0,0) 100%)}
.serit .pt{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.serit .bl{font-size:10px;color:var(--ink4);font-weight:600;min-width:12px}
.serit .sa{font-size:12px;color:var(--ink2);min-width:38px;font-weight:500}
.serit .br{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.serit .ko{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sr.done .serit{opacity:.44}
.sr.ayniBlok .serit{height:48px;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);
  box-shadow:0 8px 26px -12px #000, inset 0 0 30px -18px var(--doomL)}
.sr.ayniBlok .serit::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,var(--doomL),transparent);opacity:.7}
.sr.ayniBlok .serit .br{color:var(--ink);font-weight:500}
.sr.ayniBlok .serit .ko{color:var(--ink2)}
.sr.ayniBlok .serit .sa{color:var(--ink);font-weight:600}
.sr.ayniBlok .serit .bl{color:var(--doomL)}
.sr.uzakBlok .serit{opacity:.72}
.serit .son{font-size:10px;color:var(--bilgi);letter-spacing:.02em;white-space:nowrap;margin-left:auto;
  font-weight:600;background:rgba(123,167,217,.14);border:.5px solid rgba(123,167,217,.3);
  padding:2px 7px;border-radius:11px}
.etSat{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.et{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;
  background:rgba(123,167,217,.11);border:.5px solid rgba(123,167,217,.3);backdrop-filter:blur(12px)}
.et i{font-style:normal;font-size:14px;line-height:1}
.et b{font-size:13px;font-weight:600;color:var(--bilgi);letter-spacing:-.01em}
.et s{text-decoration:none;font-size:11px;color:var(--ink3)}
.et.spr{background:rgba(216,178,106,.11);border-color:rgba(216,178,106,.32)}
.et.spr b{color:var(--altin)}
.serit{position:relative}
.mola{display:flex;align-items:center;gap:9px;height:32px;padding:0 15px;border-radius:9px;
  background:linear-gradient(90deg,rgba(123,167,217,.20),rgba(123,167,217,.05));
  border:.5px solid rgba(123,167,217,.42);backdrop-filter:blur(11px);
  box-shadow:inset 0 0 22px -12px rgba(123,167,217,.6);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 62%,rgba(0,0,0,.3) 90%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 62%,rgba(0,0,0,.3) 90%,rgba(0,0,0,0) 100%)}
.mola i{font-style:normal;font-size:13px}
.mola b{font-size:12.5px;font-weight:700;color:var(--bilgi);letter-spacing:.01em}
.mola s{text-decoration:none;font-size:11px;color:var(--ink3)}
.sr.mm .mola{opacity:1}
.molaK{margin-top:11px;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg,rgba(123,167,217,.12),rgba(123,167,217,.03));border:.5px solid rgba(123,167,217,.3)}
.molaK b{font-size:12.5px;color:var(--bilgi);font-weight:600}
.molaK s{text-decoration:none;font-size:11.5px;color:var(--ink3)}
.molaK em{font-style:normal;margin-left:auto;font-size:10.5px;color:var(--ink4);font-family:ui-monospace,monospace}
.kart.sinav{border-color:rgba(216,178,106,.42);
  background:linear-gradient(152deg,rgba(216,178,106,.14),rgba(255,255,255,.05) 52%,rgba(255,255,255,.075))}
.kart.sinav .kSaat{font-size:17px;font-weight:400;letter-spacing:-.01em;color:var(--altin)}
.kart.sinav .sozK b{color:var(--altin)}
.kart.motiv{border-color:rgba(147,196,123,.34);
  background:linear-gradient(152deg,rgba(111,163,90,.13),rgba(255,255,255,.05) 52%,rgba(255,255,255,.075))}
.kart.motiv .kSaat{font-size:17px;font-weight:400;letter-spacing:-.01em;color:var(--doomL)}
.soz{font-size:17px;line-height:1.52;font-weight:300;letter-spacing:-.012em;color:var(--ink);margin:2px 0 11px}
.sozK{display:flex;align-items:baseline;gap:9px;padding-top:9px;border-top:.5px solid rgba(255,255,255,.08)}
.sozK b{font-size:12.5px;font-weight:600;color:var(--doomL);letter-spacing:.01em}
.sozK s{text-decoration:none;font-size:11px;color:var(--ink4)}
.sr.done .serit .ko,.sr.done .serit .br{text-decoration:line-through;text-decoration-color:var(--ink4)}
.sr.gec .serit{border-color:rgba(216,178,106,.4)}
.serit .tik{color:var(--doomL);font-size:12px}

.kart{border-radius:18px;background:rgba(255,255,255,.075);border:.5px solid rgba(255,255,255,.12);
  backdrop-filter:blur(26px) saturate(140%);box-shadow:0 24px 60px -26px #000;padding:15px 18px 13px}
/* süre doldu: 14 saniyelik döngünün ~2 saniyesinde titriyor */
@keyframes sars{
  0%,85%,100%{transform:translate3d(0,0,0)}
  86%{transform:translate3d(0,-3.5px,0)} 87.4%{transform:translate3d(0,3.5px,0)}
  88.8%{transform:translate3d(0,-3px,0)} 90.2%{transform:translate3d(0,3px,0)}
  91.6%{transform:translate3d(0,-2px,0)} 93%{transform:translate3d(0,2px,0)}
  94.4%{transform:translate3d(0,-1px,0)} 95.8%{transform:translate3d(0,1px,0)}
}
@keyframes halka{0%,100%{box-shadow:0 24px 60px -26px #000, 0 0 0 0 rgba(216,178,106,0)}
  50%{box-shadow:0 24px 60px -26px #000, 0 0 22px -4px rgba(216,178,106,.42)}}
.kart.uyar{animation:sars 14s cubic-bezier(.36,.07,.19,.97) infinite, halka 3.4s ease-in-out infinite;
  border-color:rgba(216,178,106,.42)}
.kart.uyar .kSaat{color:var(--altin)}
.doldu{display:flex;align-items:center;gap:9px;margin-top:11px;padding:8px 12px;border-radius:10px;
  background:linear-gradient(90deg,rgba(216,178,106,.18),rgba(216,178,106,.05));
  border:.5px solid rgba(216,178,106,.44)}
.doldu i{font-style:normal;font-size:13px}
.doldu b{font-size:12.5px;font-weight:700;color:var(--altin)}
.doldu s{text-decoration:none;font-size:11px;color:var(--ink3);margin-left:auto;font-family:ui-monospace,monospace}
.okurU{margin-top:9px;padding:7px 11px;border-radius:9px;font-size:11.5px;color:var(--bilgi);
  background:rgba(123,167,217,.12);border:.5px solid rgba(123,167,217,.32)}
.kart.okur .bt[data-a="b"]{opacity:.4}
.rolEt{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:16px;
  background:rgba(123,167,217,.12);border:.5px solid rgba(123,167,217,.3);font-size:10.5px;color:var(--bilgi)}
.kUst{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:10px}
.kSaat{font-size:24px;line-height:1;font-weight:600;letter-spacing:-.035em}
.kBlok{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  border:.5px solid var(--kn);border-radius:6px;padding:4px 8px;white-space:nowrap}
.kBlok.sabah{color:var(--altin);border-color:rgba(216,178,106,.42);background:rgba(216,178,106,.13);font-weight:700}
.kBlok.gece{color:var(--bilgi);border-color:rgba(123,167,217,.42);background:rgba(123,167,217,.13);font-weight:700}
.serit .bl.gece{color:var(--bilgi);font-weight:700}
.serit .bl.sabah{color:var(--altin);font-weight:700}
.kBlok.simdi{color:var(--doomL);border-color:rgba(147,196,123,.5);background:rgba(111,163,90,.10);font-weight:700}
.kBlok.gecti{color:var(--altin);border-color:rgba(216,178,106,.5);background:rgba(216,178,106,.12);font-weight:700}
.siraS{margin-top:-6px;margin-bottom:9px;font-size:10.5px;color:var(--ink4);letter-spacing:.02em}
.siraS b{color:var(--bilgi);font-weight:600}
.kBrans{display:flex;align-items:center;gap:8px;margin:0 0 5px;padding-top:11px;border-top:.5px solid rgba(255,255,255,.07)}
.kBrans .pt{width:6px;height:6px;border-radius:50%}
.kBrans span{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.kBrans em{font-style:normal;font-size:10px;color:var(--ink4);letter-spacing:.06em;margin-left:auto}
.kKonu{font-size:19px;line-height:1.25;font-weight:400;letter-spacing:-.02em;margin-bottom:7px}
.kKaynak{font-size:12.5px;color:var(--doomL)}
.otur{margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(123,167,217,.09);border:.5px solid rgba(123,167,217,.32)}
.otur b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bilgi);font-weight:700;display:block;margin-bottom:4px}
.otur p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink)}
.otur p span{color:var(--bilgi);font-weight:600}
.otur s{display:block;text-decoration:none;font-size:11px;color:var(--ink3);margin-top:4px}
.kBtn{display:flex;gap:8px;margin-top:13px}
.bt{padding:8px 14px;border-radius:10px;font-size:12.5px;border:.5px solid var(--kn);
  background:var(--cam);color:var(--ink2);backdrop-filter:blur(10px);transition:background .18s,color .18s}
.bt:hover{background:var(--cam2);color:var(--ink)}
.bt.pri{background:rgba(235,240,245,.92);border-color:transparent;color:#0A0C10;font-weight:600}
.bt.alt{background:rgba(216,178,106,.9);border-color:transparent;color:#100C05;font-weight:600}
.bt.gh{margin-left:auto;color:var(--ink4)}

#uzay{position:relative;overflow:hidden;min-height:0}
#brif{position:absolute;inset:10px 14px 4px 4px;padding:0;overflow:visible;
  display:flex;flex-wrap:wrap;align-content:flex-end;align-items:flex-end;gap:6px;
  opacity:0;transition:opacity .26s ease;pointer-events:none}
#brif>*{pointer-events:auto}
#brif.gor{opacity:1}
/* ── sticker çip ── */
.cip{border-radius:16px;padding:8px 13px;
  background:linear-gradient(152deg,rgba(255,255,255,.10),rgba(255,255,255,.035) 60%,rgba(255,255,255,.065));
  border:.5px solid rgba(255,255,255,.13);
  backdrop-filter:blur(26px) saturate(175%);-webkit-backdrop-filter:blur(26px) saturate(175%);
  box-shadow:0 12px 34px -18px rgba(0,0,0,.85), inset 0 .5px 0 rgba(255,255,255,.09);
  min-width:0}
.cip.tam{flex:1 1 100%}
.cip.dar{flex:0 0 auto}
.cEt{display:inline-flex;align-items:center;gap:7px;border-radius:16px;padding:5px 11px}
.cEt i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.cEt span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cNed .h{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--doomL);font-weight:600;margin-bottom:4px}
.cNed p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink);font-weight:300;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5}
.cMet{display:flex;align-items:baseline;gap:7px;padding:5px 11px;border-radius:14px}
.cMet u{text-decoration:none;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4);font-weight:600}
.cMet b{font-size:12.5px;font-weight:500;color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace}
.cMet.g b{color:var(--doomL)}
.cKom .h{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--bilgi);font-weight:600;margin-bottom:3px}
/* ── KOMBO ÇİPİ · katlanır başlık ────────────────────────────────
   Kapalıyken tek satır, dokununca yerinde açılıyor. Sayı kombo yoğunluğunu
   gösteriyor: 1× sakin, 2× altın, 3–4× turuncu kıvılcım, 5+ kuyruklu yıldız.
   Ölçülen dağılım: 1×→24 görev · 2×→34 · 3–4×→13 · 5+→3 (en çok 7×). */
.cKom .kmbB{display:flex;align-items:center;gap:7px;width:100%;margin:0;padding:0;border:0;
  background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-appearance:none}
.cKom .kmbB:focus-visible{outline:1.5px solid var(--bilgi);outline-offset:3px;border-radius:6px}
.cKom .kmbS{font-size:12px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--bilgi);line-height:1}
.cKom .kmbT{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--bilgi);font-weight:600}
.cKom .kmbO{margin-left:auto;font-size:9px;color:var(--ink3);transition:transform .22s ease}
.cKom.acik .kmbO{transform:rotate(180deg)}
.cKom .kmbG{display:none;margin-top:7px}
.cKom.acik .kmbG{display:block}
.cKom.acik .kmbG p{-webkit-line-clamp:unset;display:block}   /* açıkken satır kırpması kalksın */
/* Isaret ogesi kademeye gore bicim degistirir. Hareket YAVAS ve MONOTON:
   yalniz parlaklik ve halka nefes alir; hicbir sey ziplamaz, kaymaz, titremez.
   Sureler farkli (4.6s · 5.4s · 5.0s) ki senkron yanip sonme hissi dogmasin. */
.cKom .kmbK{position:relative;flex:0 0 auto;display:block;width:5px;height:5px;border-radius:50%;
  background:var(--bilgi);opacity:.7}
.cKom .kmbK::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid transparent;pointer-events:none}
.cKom.k2 .kmbS,.cKom.k2 .kmbT{color:var(--altin)}
.cKom.k2 .kmbK{background:var(--altin);opacity:.9;box-shadow:0 0 7px rgba(216,178,106,.55)}
.cKom.k3 .kmbS,.cKom.k3 .kmbT{color:var(--turuncu)}
.cKom.k3 .kmbS{text-shadow:0 0 8px rgba(210,149,95,.45)}
.cKom.k3 .kmbK{width:6px;height:6px;background:var(--turuncu);box-shadow:0 0 10px rgba(210,149,95,.6)}
.cKom.k3 .kmbK::after{border-color:rgba(210,149,95,.5)}
.cKom.k4 .kmbS,.cKom.k4 .kmbT{color:#F2C57C}
.cKom.k4 .kmbS{text-shadow:0 0 6px rgba(242,197,124,.85),0 0 16px rgba(210,149,95,.5),0 0 30px rgba(181,84,76,.28)}
.cKom.k4 .kmbK{width:22px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(242,197,124,0),rgba(242,197,124,.95));
  box-shadow:0 0 10px rgba(242,197,124,.55);opacity:1}
.cKom.k4 .kmbK::after{inset:-5px -5px -5px auto;width:13px;border-radius:50%;border-color:rgba(242,197,124,.55)}
@media (prefers-reduced-motion:no-preference){
  .cKom.k2 .kmbK{animation:komboNefes 4.6s ease-in-out infinite}
  .cKom.k3 .kmbK{animation:komboNefes 4.6s ease-in-out infinite}
  .cKom.k3 .kmbK::after,.cKom.k4 .kmbK::after{animation:komboHalka 5.4s ease-out infinite}
  .cKom.k3 .kmbS,.cKom.k4 .kmbS{animation:komboParla 5s ease-in-out infinite}
  .cKom.k4 .kmbK{animation:komboKuyruk 5s ease-in-out infinite}
  @keyframes komboNefes{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes komboHalka{0%{transform:scale(.55);opacity:.6}72%{opacity:0}100%{transform:scale(2.3);opacity:0}}
  @keyframes komboParla{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.14)}}
  @keyframes komboKuyruk{0%,100%{opacity:.5;width:13px}50%{opacity:1;width:26px}}
}
.cKom p{margin:0 0 2px;font-size:11px;line-height:1.4;color:var(--ink2);font-weight:300;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.cKom p b{color:var(--doomL);font-weight:600}
.cKom p:last-child{margin-bottom:0}
.cSoz p{margin:0;font-size:15.5px;line-height:1.5;font-weight:300;color:var(--ink);

Kalp Damar Cerrahisi", 0], ["2026-08-15|B|Genel Cerrahi|Meme Hastalıkları ve Cerrahisi", "2026-08-15|B|Küçük Stajlar|Dermatoloji", "Lezyon morfolojisi patoloji ve klinik tarafından aynı dille sorulur", "Genel Cerrahi · Meme Hastalıkları ve Cerrahisi", "Küçük Stajlar · Dermatoloji", 0]], ISARET=[["2026-07-27", "Neden farmakoloji ile başlıyoruz?", "Farmakoloji 18 soruluk bir branş ve sen %18 yapıyorsun — açığın en büyük olduğu yer. Kemoterapötikler tek başına 4.6 soru/sınav. Programın ilk günü zihinsel enerjinin en yüksek olduğu gün; onu en yüksek getirili bloğa harcıyoruz. 26 Temmuz planla geçtiği için bu günün işleri sabah 06:00 telafi bloklarına dağıtıldı."], ["2026-07-27", "Neden kitabı açmadan soru çözüyorsun?", "Blok A'daki ön-test kasıtlı. Geri getirme pratiği pasif okumadan belirgin şekilde üstün (Roediger & Karpicke, 2006). Yanlışların okumada neye odaklanacağını söylüyor — kitabın tamamını eşit dikkatle okumak yerine bilmediğin kısma yükleniyorsun."], ["2026-08-01", "Neden ilk deneme 6. günde?", "Model kalibrasyonu. Tüm tahsisler 'yüksek getiri konularında %60 başarıya ulaşırsın' varsayımına dayanıyor ve bu test edilmeli. Altı gün ölçülebilir değişim üretecek kadar uzun, rotayı düzeltebilecek kadar erken."], ["2026-08-08", "Neden dahiliye videosu bugün bitiyor?", "Bu tarihi biz seçmedik. Atilla Uslu videolarına erişimin 9-10 Ağustos'ta kapanıyor. 24 sa 25 dk'lık içerik 1.5x'te 16.3 saate iniyor ve 11 akşama yayıldı. Programdaki tek dış kısıt bu."], ["2026-08-09", "Neden kardiyoloji videosu en sona bırakıldı?", "Yarın Pediatri Kardiyoloji bloğuna gireceksin. Endokardit, perikardit ve kapak hastalıkları ikisinde de var; dahiliye tarafı taze olursa pediatride sadece farkları öğrenip iki soruyu birden alıyorsun. Bu senin kendi fikrindi."], ["2026-08-13", "Neden anatomi ikinci fazda?", "İki karar var. Kaynak: nöroanatomi TTS'te 83 sayfa, Fast Track'te 35 — aynı 4.2 soru, üç kat ucuz. Zamanlama: anatomi saf ezber, erken öğrenilirse unutulur. Sınava on gün kala yerleştirmek ezberin sınav gününe taze ulaşmasını sağlıyor."], ["2026-08-20", "Neden son deneme burada?", "Sınava üç gün kalıyor. Denemenin analizi aynı akşam yapılıyor ve düzeltmeye iki tam gün kalıyor. Daha geç bir deneme ölçüm verir ama düzeltme fırsatı vermez."], ["2026-08-21", "Neden son iki gün sıfır yeni konu?", "Sınava iki gün kala öğrenilen bilgi yeterince tekrar edilemediği için kalıcı olmuyor — öğrenme eğrisi değil unutma eğrisi çalışıyor. Bu iki gün önceki 25 günün sınav sabahına sağlam ulaşması için."]], KHARITA={"kitap": [{"ad": "Anatomi Fast Track", "s": [["merkezi sinir sistemi anatomisi", "90–106", 2.3, ["2026-07-30"], 1], ["periferik sinir sistemi + duyu organları", "106–119", 1.9, ["2026-07-30"], 1], ["sindirim sistemi anatomisi", "77–90", 1.8, ["2026-07-29", "2026-08-10"], 2]], "cop": [["Kemikler", "5–22", 1.0, "0.08 net/saat · programın en düşüğü 0.09 — eşiğin altında · 17.0 sf/soru · turuncu"], ["Eklemler", "22–28", 0.2, "0.05 net/saat · programın en düşüğü 0.09 — eşiğin altında · 30.0 sf/soru · sari"], ["Kaslar", "28–49", 2.2, "0.15 net/saat · zincir gününde yer kalmadı · 9.5 sf/soru · pembe"], ["Pleksuslar", "49–55", 0.0, "6 sayfada 0 soru — hiç getiri yok · 0.0 sf/soru · mavi"], ["Solunum", "55–60", 1.0, "0.29 net/saat · zincir gününde yer kalmadı · 5.0 sf/soru · turuncu"], ["Dolaşım", "60–77", 1.4, "0.12 net/saat · zincir gününde yer kalmadı · 12.1 sf/soru · turuncu"], ["Ürogenital", "119–124", 0.0, "5 sayfada 0 soru — hiç getiri yok · 0.0 sf/soru · mavi"], ["Endokrin", "124–126", 0.0, "2 sayfada 0 soru — hiç getiri yok · 0.0 sf/soru · sari"], ["Deri ekleri", "126–127", 0.0, "1 sayfada 0 soru — hiç getiri yok · 0.0 sf/soru · sari"]], "say": {"pembe": [2, 3], "turuncu": [0, 3], "sari": [1, 4], "mavi": [1, 3]}, "ic": 4, "tp": 13}, {"ad": "Atilla Uslu Dahiliye videoları · 1.5x", "s": [], "cop": [], "say": null}, {"ad": "Feyyaz Akay Oldies", "s": [["Bakteriyoloji", "", 0, ["2026-07-27", "2026-08-09"], 2], ["Mikoloji + Tıbbi Parazitoloji", "", 0, [   const dar=kw.width<880;
  const R=Math.max(dar?300:340,Math.min(980,kw.height*(dar?1.28:1.45)));
  const BO=Math.max(dar?5:6,Math.min(9,kw.height/(dar?78:70)));
  const h=c.map(x=>{x.style.marginTop='';return x.getBoundingClientRect().height});
  const anaht=c.map(x=>{const q=x.dataset.i;
    if(String(q).startsWith('m'))return 'mola';

  const ara=i=>{const p=anaht[i-1],q=anaht[i];
    const kd=(p===akA&&q==='mola')||(p==='mola'&&q===akA)||(p===q&&p===akA);
    if(kd)return BO*0.34;
    if(p==='mola'||q==='mola')return BO*0.7;

  const kume=c.map((x,i)=>anaht[i]===akA||(anaht[i]==='mola'&&(anaht[i-1]===akA||anaht[i+1]===akA)));

     bu pay yüzlerce piksele çıkıp şeritleri iç içe geçirir. Bu yüzden açı, ek dikey

     Açı ↔ boşluk karşılıklı bağımlı olduğu için dört geçişle yakınsanıyor. */
  const EK_PAY=16;

  const acıSinir=i=>Math.asin(Math.min(0.85,EK_PAY/Math.max(W[i],1)));

    th=y.map(v=>Math.asin(Math.max(-SIN,Math.min(SIN,v/R))));

    const kk=kardes||molaK;
    x.style.marginTop=(-h[i]/2)+'px';
    const sc=kk?1:(komsu?Math.max(.86,Math.pow(Math.cos(t),.34)):Math.max(.74,Math.pow(Math.cos(t),.5)));
    x.style.transform='translate('+(R*(Math.cos(t)-1)*(kk?0.34:1)).toFixed(1)+'px,'+(R*Math.sin(t)).toFixed(1)+'px) rotate('+(ac[i]*180/Math.PI).toFixed(2)+'deg) scale('+sc.toFixed(3)+')';
    x.style.opacity=i===a?1:kk?0.97:(ab>1.14?0:Math.max(0,(komsu?.72:.52)-ab*(komsu?.42:.9)));

const YKD=['d1','d2','d3','d4','d5','d6'];
function brifYogunluk(bf){
  if(!bf)return null;
  bf.classList.remove('d1','d2','d3','d4','d5','d6');
  /* Bütçe: panel mutlak konumdaysa kendi kutusu, akıştaysa kapsayıcısı.
     Ölçüm alınamazsa EN GENİŞ kademeyle başlanır — başarısız ölçüm asla
     bozuk düzene yol açmaz; daraltma yalnız gerçek taşmada yapılır. */
  const kap=bf.parentElement||document.getElementById('uzay');
  let b=0, olculdu=false;
  const kh=kap?(kap.clientHeight||kap.getBoundingClientRect().height||0):0;
  if(kh>40){b=kh-14;olculdu=true}
  if(!olculdu){const oh=bf.clientHeight||bf.getBoundingClientRect().height||0;
    if(oh>40){b=oh-4;olculdu=true}}
  if(!olculdu)b=1e4;              // hiç ölçülemedi → en geniş kademe, sonra gerçek taşmada daralt
  b=Math.max(0,b);
  let j = b>=250?0 : b>=185?1 : b>=145?2 : b>=112?3 : b>=78?4 : 5;
  bf.classList.add(YKD[j]);
  let n=0;
  while(n<6&&j<5){
    const ic=bf.scrollHeight||0;
    if(!(ic>b+2))break;
    bf.classList.remove(YKD[j]); j++; bf.classList.add(YKD[j]); n++}
  return YKD[j]}

function bransDurum(){const o=son(),r={};
  RB.forEach(b=>{let net=null;
    if(o.bn)net=b==='Fizyoloji'?(+(o.bn['Fizyoloji']||0))+(+(o.bn['Histo-Embriyoloji']||0)):(o.bn[b]!=null?+o.bn[b]:null);

    let olc=(net!=null&&payda)?net/payda:null;
    if(b==='Küçük Stajlar'&&olc==null&&o.k)olc=o.k/100;
    let kz=0;GOREVLER.forEach(g=>{const bt=D.bitti[id(g)];if(bt&&bt>o.tar&&g.br===b)kz+=g.kaz});
    r[b]={olc,bek:olc==null?null:Math.min(olc+kz/SORU.radar[b],1),artis:kz/SORU.radar[b],kz}});
  return r}
function radarCiz(){const st=bransDurum(),N=RB.length,R=112,CX=250,CY=175;

function miniCiz(b){const v=sirali(),st=bransDurum()[b];

  if(yeniGun){sonGun=bgun();motivKapat=false;sinavKapat=false;uyariVerildi={};aktif=bul();carkCiz();brifCiz(GOREVLER[aktif]);sonDk=simdi();return}
  // motiv moduna girme/çıkma
  const sYeni=sinavGunu()&&!sinavKapat;
  const mYeni=!sYeni&&gunKapandi()&&!motivKapat;
  if(sYeni!==sinavMod||mYeni!==motivMod){carkCiz();brifCiz(GOREVLER[aktif]);sonDk=simdi();return}
  // süre doldu durumu değiştiyse kartı yenile
  if(kartEl){
    const varMi=kartEl.classList.contains('uyar');
    if(sd!==varMi){carkCiz();brifCiz(g)}
    else if(sd){const s=kartEl.querySelector('.doldu s');if(s)s.textContent='+'+gecikme(g)+' dk'}
    const e=kartEl.querySelector('.kBlok');
    if(e){const su=suAnMi(g),gc=gecmis(g)&&!D.bitti[id(g)];
      e.className='kBlok'+(su?' simdi':(gc?' gecti':''));
      e.textContent=su?'ŞU AN':gc?'VAKTİ GEÇTİ':(g.act==='deneme'?'Sınav simülasyonu':(g.b==='Z'?'SABAH TELAFİ':g.b==='F'?'GECE EK SEANS':'Blok '+g.b))}}
  // bildirim: bugünün süresi dolan ilk tamamlanmamış görevi bir kez duyur
  const bug=GOREVLER.filter(x=>x.d===bgun()&&!D.bitti[id(x)]&&sureDoldu(x));
  if(bug.length){
    const x=bug[0], anah=id(x);
    if(!uyariVerildi[anah]){
      uyariVerildi[anah]=1;
      const snr=GOREVLER.find(y=>y.d===x.d&&!D.bitti[id(y)]&&y!==x);
      Bild.gonder('Süre doldu · '+x.t,
        x.br+' — '+x.k+(snr?'\nSıradaki: '+snr.t+' · '+snr.br:''),'rota-sure');
      if(navigator.vibrate)try{navigator.vibrate([90,70,90])}catch(e){}}}
  sonDk=simdi();
}
setInterval(nabiz,15000);
/* PERİYODİK SENKRON — uygulama ekranda açıkken karşı cihazı yoklar.
   Bundan önce senkron yalnız açılış/öne gelme/odak/ağa dönüş anlarında tetikleniyordu;
   telefon zaten açıkken iPad'de yapılan değişiklik elle "karşı cihazdan yükle"ye
   basılmadan hiç gelmiyordu.
   UYARLANABİLİR ARALIK: değişiklik geldikçe 45 sn, hiçbir şey değişmiyorsa her turda
   1.6 katına çıkıp 6 dakikada sabitlenir. Öne gelme, odak ve yerel kayıt aralığı sıfırlar.
   Yoklama YALNIZ OKUR; yazma ancak yerelde değişiklik varsa olur. */
const YOK_ALT=45000, YOK_UST=360000;
let yokAra=YOK_ALT, yokZam=null;
function yokSifirla(){yokAra=YOK_ALT;yokKur()}
function yokKur(){
  clearTimeout(yokZam);
  yokZam=setTimeout(async()=>{
    if(document.visibilityState!=='hidden'&&Senk.kur()){
      let d='';
      try{d=await Senk.esitle()}catch(e){}
      if(d==='diğer cihazdan alındı'||d==='bu cihazdan gönderildi')yokAra=YOK_ALT;
      else yokAra=Math.min(YOK_UST,Math.round(yokAra*1.6));
    }
    yokKur();
  },yokAra);
}
yokKur();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){nabiz();yokSifirla();if(Senk.kur())Senk.esitle()}});
window.addEventListener('focus',()=>{nabiz();yokSifirla();if(Senk.kur())Senk.esitle()});
window.addEventListener('online',()=>{if(Senk.kur())Senk.esitle()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
